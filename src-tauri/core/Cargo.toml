[package]
name = "stivo-core"
version = "0.1.0"
description = "Núcleo do Stivo desktop: o equivalente ao backend do docker_gui.py, sem Tauri e sem HTTP"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "stivo_core"

[features]
# o binário de teste que serve a página da web com este núcleo (os specs do Playwright rodam contra ele). Nunca entra
# no instalador: o app desktop não liga esta feature
harness = ["dep:axum", "dep:getrandom"]

[[bin]]
name = "harness"
required-features = ["harness"]

[dependencies]
async-trait = "=0.1.92"
futures-util = "=0.3.34"
log = "=0.4.34"
percent-encoding = "=2.3.2"
regex = "=1.13.1"
# preserve_order: as Labels do podman (um dict) viram texto na ordem em que vieram, como no Python
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.54.0", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
axum = { version = "=0.8.9", features = ["ws"], optional = true }
getrandom = { version = "=0.3.4", optional = true }

[dev-dependencies]
tokio = { version = "=1.54.0", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
