name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.10"  # fixo: release nova do ruff muda as regras padrão e quebraria PRs sem mudança de código

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # imagem oficial em vez de setup-python: o 3.7 que o README promete não existe mais no toolcache do runner
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - run: python -m unittest -v

  e2e:
    name: e2e (Docker real)
    runs-on: ubuntu-latest  # já vem com o daemon Docker rodando
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python -m unittest -v
        env:
          DOCKER_GUI_E2E: "1"
