ShortDescription: Gerenciador de containers para Docker e Podman, que avisa da bandeja quando algo quebra
Description: |-
  O Stivo mostra os containers Docker e Podman da sua máquina ao vivo, diz o que quebrou e por quê (código de saída,
  healthcheck, loop de reinício) e fecha o ciclo reiniciar e ler logs sem sair da janela: logs ao vivo, compose,
  terminal no container. Fechar a janela deixa o Stivo na bandeja, avisando quando um container cai.
